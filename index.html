<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>루빅스 큐브 십자 맞추기 컬러 뉴트럴 연습기</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
      background: #000;
      color: #eee;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 640px;
      padding: 60px 20px;
      text-align: center;
    }

    .page-title {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 30px;
    }

    .menu {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 30px;
    }

    .scheme-btn {
      padding: 10px 24px;
      font-size: 15px;
      border: 2px solid #888;
      background: #111;
      color: #eee;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .scheme-btn.active {
      background: #eee;
      color: #000;
      border-color: #eee;
    }

    .question-title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 24px;
    }

    .quiz-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .cube-wrap {
      position: relative;
      width: 288px;
      height: 288px;
    }

    .cube-svg {
      width: 100%;
      height: 100%;
    }

    .popup {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
    }

    .popup.popup-correct {
      background: #16a34a;
    }

    .popup.popup-wrong {
      background: #dc2626;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 200px;
    }

    .option-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border: 2px solid #555;
      border-radius: 8px;
      background: #111;
      cursor: pointer;
      font-size: 15px;
    }

    .option-btn:hover {
      border-color: #999;
    }

    .option-btn.disabled {
      pointer-events: none;
      opacity: 0.5;
    }

    .option-btn.hint-disabled {
      pointer-events: none;
      opacity: 0.38;
      cursor: default;
    }

    .option-btn.next-btn {
      pointer-events: auto;
      opacity: 1;
      border-color: #f59e0b;
      background: #2a1d0a;
      justify-content: center;
      font-weight: bold;
    }

    .swatch {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      border: 1px solid #aaa;
    }

    .score {
      font-size: 13px;
      color: #999;
    }

    .lock-panel {
      display: none;
      flex-direction: column;
      gap: 10px;
      align-items: center;
      background: #111;
      border: 1px solid #444;
      border-radius: 10px;
      padding: 14px;
      margin: 0 auto 24px;
      max-width: 460px;
    }

    .lock-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .face-option-btn {
      padding: 8px 18px;
      border-radius: 6px;
      border: 2px solid #666;
      background: #000;
      color: #eee;
      cursor: pointer;
      font-weight: bold;
    }

    .lock-colors {
      display: none;
      gap: 6px;
    }

    .lock-colors.open {
      display: flex;
    }

    .lock-swatch {
      width: 26px;
      height: 26px;
      border-radius: 5px;
      border: 1px solid #999;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="page-title">rubiks cube color neutral trainer</div>
    <div class="menu">
      <button id="btn-standard" class="scheme-btn active">표준</button>
      <button id="btn-japanese" class="scheme-btn">일본식</button>
      <button id="btn-lock" class="scheme-btn">색깔고정</button>
    </div>

    <div class="lock-panel" id="lock-panel">
      <div class="lock-row" data-face="U"><button class="face-option-btn" data-face="U">U면</button>
        <div class="lock-colors" data-face="U"></div>
      </div>
      <div class="lock-row" data-face="F"><button class="face-option-btn" data-face="F">F면</button>
        <div class="lock-colors" data-face="F"></div>
      </div>
      <div class="lock-row" data-face="D"><button class="face-option-btn" data-face="D">D면</button>
        <div class="lock-colors" data-face="D"></div>
      </div>
    </div>

    <div class="question-title" id="question-title"></div>
    <div class="quiz-row" id="quiz-row"></div>
    <div class="score" id="score">맞은 개수: 0 / 0</div>
  </div>

  <script>
    const COLORS = [
      { key: 'white', name: '흰색', hex: '#FFFFFF' },
      { key: 'yellow', name: '노랑', hex: '#FFD500' },
      { key: 'blue', name: '파랑', hex: '#0051BA' },
      { key: 'green', name: '초록', hex: '#009E60' },
      { key: 'red', name: '빨강', hex: '#C41E3A' },
      { key: 'orange', name: '주황', hex: '#FF5800' }
    ];
    const colorMap = Object.fromEntries(COLORS.map(c => [c.key, c]));
    const SCHEMES = {
      standard: { U: 'white', D: 'yellow', F: 'green', B: 'blue', L: 'orange', R: 'red' },
      japanese: { U: 'white', D: 'blue', F: 'green', B: 'yellow', L: 'orange', R: 'red' }
    };

    function rotateY(s) { return { U: s.U, D: s.D, F: s.L, R: s.F, B: s.R, L: s.B }; }
    function rotateX(s) { return { L: s.L, R: s.R, U: s.B, F: s.U, D: s.F, B: s.D }; }
    function key(s) { return [s.U, s.D, s.F, s.B, s.L, s.R].join(','); }

    function generateOrientations(base) {
      const seen = new Map();
      seen.set(key(base), base);
      const queue = [base];
      while (queue.length) {
        const cur = queue.shift();
        for (const next of [rotateX(cur), rotateY(cur)]) {
          const k = key(next);
          if (!seen.has(k)) { seen.set(k, next); queue.push(next); }
        }
      }
      return Array.from(seen.values());
    }

    let currentScheme = 'standard';
    let orientations = generateOrientations(SCHEMES[currentScheme]);
    let currentProblem = null, pairType = null, currentSide = null, answered = false;
    let previousProblemKey = null;
    let score = { correct: 0, total: 0 }, fixedFace = null, fixedColor = null, expandedFace = null;

    // 큐브의 기하 도형은 UF-L / UF-R / FD-L / FD-R 네 종류뿐이므로
    // 처음 한 번만 생성해 캐시하고, 이후에는 중앙 스티커의 fill과 ?만 갱신한다.
    const cubeCache = new Map();
    let cubeWrap = null;
    let optionsEl = null;

    function createCubeSVG(pair, side) {
      const isUF = pair === 'UF';
      const isL = side === 'L';
      const stroke = '#1a1a1a';
      const strokeW = '1.8';
      const bgBlock = '#333333';
      const cx = 120, cy = 120;

      const yaw = (isL ? 32 : -32) * Math.PI / 180;
      const pitch = (isUF ? 20 : -20) * Math.PI / 180;
      const cameraDistance = 5.0;
      const focalLength = 285;

      function project([x, y, z]) {
        const x1 = x * Math.cos(yaw) + z * Math.sin(yaw);
        const z1 = -x * Math.sin(yaw) + z * Math.cos(yaw);
        const y2 = y * Math.cos(pitch) - z1 * Math.sin(pitch);
        const z2 = y * Math.sin(pitch) + z1 * Math.cos(pitch);
        const scale = focalLength / (cameraDistance - z2);
        return [cx + x1 * scale, cy - y2 * scale];
      }

      function drawFace(pts, fill, role = '') {
        const roleAttr = role ? ` data-role="${role}"` : '';
        return `<polygon${roleAttr} points="${pts.map(p => p.join(',')).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${strokeW}" stroke-linejoin="round"/>`;
      }

      function drawGrid3D(pointAt, centerRole) {
        let str = '';
        for (let r = 0; r < 3; r++) {
          for (let c = 0; c < 3; c++) {
            const u0 = r / 3, u1 = (r + 1) / 3;
            const v0 = c / 3, v1 = (c + 1) / 3;
            const q = [
              project(pointAt(u0, v0)),
              project(pointAt(u1, v0)),
              project(pointAt(u1, v1)),
              project(pointAt(u0, v1))
            ];
            const isCenter = r === 1 && c === 1;
            str += drawFace(q, bgBlock, isCenter ? centerRole : '');

            if (isCenter && centerRole === 'side-center') {
              const center = project(pointAt(0.5, 0.5));
              str += `<text data-role="side-question" x="${center[0]}" y="${center[1] + 4}" font-size="18" font-weight="bold" fill="#888" text-anchor="middle" dominant-baseline="middle">?</text>`;
            }
          }
        }
        return str;
      }

      const frontPoint = (u, v) => [-1 + 2 * v, 1 - 2 * u, 1];
      const topPoint = (u, v) => [-1 + 2 * v, 1, -1 + 2 * u];
      const bottomPoint = (u, v) => [-1 + 2 * v, -1, 1 - 2 * u];
      const sidePoint = isL
        ? ((u, v) => [-1, 1 - 2 * u, -1 + 2 * v])
        : ((u, v) => [1, 1 - 2 * u, 1 - 2 * v]);

      let svgText = `<svg class="cube-svg" viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">`;
      if (isUF) {
        svgText += drawGrid3D(topPoint, 'vertical-center');
        svgText += drawGrid3D(frontPoint, 'front-center');
      } else {
        svgText += drawGrid3D(bottomPoint, 'vertical-center');
        svgText += drawGrid3D(frontPoint, 'front-center');
      }
      svgText += drawGrid3D(sidePoint, 'side-center');
      svgText += `</svg>`;

      const template = document.createElement('template');
      template.innerHTML = svgText.trim();
      return template.content.firstElementChild;
    }

    function initializeCubeCache() {
      for (const pair of ['UF', 'FD']) {
        for (const side of ['L', 'R']) {
          cubeCache.set(`${pair}-${side}`, createCubeSVG(pair, side));
        }
      }
    }

    function showCurrentCube(isRevealed = false) {
      const key = `${pairType}-${currentSide}`;
      const svg = cubeCache.get(key);
      const verticalCenter = svg.querySelector('[data-role="vertical-center"]');
      const frontCenter = svg.querySelector('[data-role="front-center"]');
      const sideCenter = svg.querySelector('[data-role="side-center"]');
      const questionMark = svg.querySelector('[data-role="side-question"]');

      verticalCenter.setAttribute('fill', colorMap[isUFPair() ? currentProblem.U : currentProblem.D].hex);
      frontCenter.setAttribute('fill', colorMap[currentProblem.F].hex);
      sideCenter.setAttribute('fill', isRevealed ? colorMap[currentProblem[currentSide]].hex : '#333333');
      questionMark.style.display = isRevealed ? 'none' : '';

      cubeWrap.replaceChildren(svg);
    }

    function isUFPair() {
      return pairType === 'UF';
    }

    function buildQuizDOM() {
      const quizRow = document.getElementById('quiz-row');
      quizRow.innerHTML = '';

      cubeWrap = document.createElement('div');
      cubeWrap.className = 'cube-wrap';
      cubeWrap.id = 'cube-wrap';

      optionsEl = document.createElement('div');
      optionsEl.className = 'options';
      COLORS.forEach(c => {
        const btn = document.createElement('div');
        btn.className = 'option-btn';
        btn.dataset.key = c.key;
        btn.innerHTML = `<span class="swatch" style="background:${c.hex}"></span><span class="option-label">${c.name}</span>`;
        btn.addEventListener('click', () => selectAnswer(c.key, btn));
        optionsEl.appendChild(btn);
      });

      quizRow.appendChild(cubeWrap);
      quizRow.appendChild(optionsEl);
    }

    function resetOptionButtons() {
      optionsEl.querySelectorAll('.option-btn').forEach((btn, index) => {
        const c = COLORS[index];
        btn.removeEventListener('click', newProblem);
        btn.classList.remove('disabled', 'next-btn', 'hint-disabled');
        btn.innerHTML = `<span class="swatch" style="background:${c.hex}"></span><span class="option-label">${c.name}</span>`;
      });
    }

    function disableHintColorButtons() {
      const shownColors = new Set([
        isUFPair() ? currentProblem.U : currentProblem.D,
        currentProblem.F
      ]);

      optionsEl.querySelectorAll('.option-btn').forEach(btn => {
        if (shownColors.has(btn.dataset.key)) {
          btn.classList.add('hint-disabled');
        }
      });
    }

    function renderProblem() {
      document.getElementById('question-title').textContent = currentSide === 'L' ? '왼쪽 면(?)의 색은?' : '오른쪽 면(?)의 색은?';
    }

    function selectAnswer(selectedKey, btnEl) {
      if (answered) return;
      answered = true;
      score.total++;

      const correctKey = currentProblem[currentSide];
      const isCorrect = selectedKey === correctKey;

      showCurrentCube(true);

      const popup = document.createElement('div');
      popup.className = 'popup ' + (isCorrect ? 'popup-correct' : 'popup-wrong');
      popup.textContent = isCorrect ? '정답' : '오답';
      cubeWrap.appendChild(popup);

      document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled'));

      if (isCorrect) score.correct++;
      document.getElementById('score').textContent = `맞은 개수: ${score.correct} / ${score.total}`;

      btnEl.classList.remove('disabled');
      btnEl.classList.add('next-btn');
      btnEl.innerHTML = `<span>다음문제</span>`;
      btnEl.addEventListener('click', newProblem, { once: true });
    }

    function newProblem() {
      let picked, nextSide, nextProblemKey;
      let attempts = 0;

      do {
        picked = pickOrientationAndPairType();
        nextSide = Math.random() < 0.5 ? 'L' : 'R';
        nextProblemKey = `${key(picked.orientation)}|${picked.pairType}|${nextSide}`;
        attempts++;
      } while (nextProblemKey === previousProblemKey && attempts < 100);

      currentProblem = picked.orientation;
      pairType = picked.pairType;
      currentSide = nextSide;
      previousProblemKey = nextProblemKey;
      answered = false;
      resetOptionButtons();
      disableHintColorButtons();
      showCurrentCube(false);
      renderProblem();
    }

    function pickOrientationAndPairType() {
      if (!fixedFace) {
        return { orientation: orientations[Math.floor(Math.random() * orientations.length)], pairType: Math.random() < 0.5 ? 'UF' : 'FD' };
      }
      if (fixedFace === 'U') {
        const filtered = orientations.filter(o => o.U === fixedColor);
        return { orientation: filtered[Math.floor(Math.random() * filtered.length)], pairType: 'UF' };
      }
      if (fixedFace === 'D') {
        const filtered = orientations.filter(o => o.D === fixedColor);
        return { orientation: filtered[Math.floor(Math.random() * filtered.length)], pairType: 'FD' };
      }
      const filtered = orientations.filter(o => o.F === fixedColor);
      return { orientation: filtered[Math.floor(Math.random() * filtered.length)], pairType: Math.random() < 0.5 ? 'UF' : 'FD' };
    }

    function buildLockPanel() {
      document.querySelectorAll('.lock-colors').forEach(container => {
        container.innerHTML = '';
        const face = container.dataset.face;
        COLORS.forEach(c => {
          const sw = document.createElement('div');
          sw.className = 'lock-swatch';
          sw.style.background = c.hex;
          sw.addEventListener('click', () => {
            fixedFace = face;
            fixedColor = c.key;
            document.getElementById('lock-panel').style.display = 'none';
            document.getElementById('btn-lock').textContent = '색깔 고정 해제';
            newProblem();
          });
          container.appendChild(sw);
        });
      });
    }

    document.querySelectorAll('.face-option-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const face = btn.dataset.face;
        const isOpen = expandedFace === face;
        document.querySelectorAll('.lock-colors').forEach(c => c.classList.remove('open'));
        if (!isOpen) {
          expandedFace = face;
          document.querySelector(`.lock-colors[data-face="${face}"]`).classList.add('open');
        } else expandedFace = null;
      });
    });

    document.getElementById('btn-lock').addEventListener('click', () => {
      const lockPanel = document.getElementById('lock-panel');
      if (fixedFace) {
        fixedFace = fixedColor = expandedFace = null;
        document.getElementById('btn-lock').textContent = '색깔고정';
        lockPanel.style.display = 'none';
        newProblem();
      } else {
        lockPanel.style.display = lockPanel.style.display === 'flex' ? 'none' : 'flex';
      }
    });

    buildLockPanel();
    initializeCubeCache();
    buildQuizDOM();

    document.getElementById('btn-standard').addEventListener('click', () => {
      currentScheme = 'standard';
      document.getElementById('btn-standard').classList.add('active');
      document.getElementById('btn-japanese').classList.remove('active');
      orientations = generateOrientations(SCHEMES.standard);
      newProblem();
    });

    document.getElementById('btn-japanese').addEventListener('click', () => {
      currentScheme = 'japanese';
      document.getElementById('btn-japanese').classList.add('active');
      document.getElementById('btn-standard').classList.remove('active');
      orientations = generateOrientations(SCHEMES.japanese);
      newProblem();
    });

    newProblem();
  </script>
</body>

</html>
